version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: nike-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nike-server
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/nike-ecommerce?authSource=admin
      JWT_SECRET: your_secret_key_here
      NODE_ENV: production
    volumes:
      - ./server:/app/server

  nginx:
    image: nginx:alpine
    container_name: nike-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - server

volumes:
  mongodb_data:

networks:
  default:
    name: nike-network
